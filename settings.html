<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self'"
		>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>iPhone Clipboard Settings</title>
		<link rel="stylesheet" href="settings.css">
	</head>
	<body>
		<main>
			<h1>Settings</h1>
			<form id="settings-form">
				<label for="api-url">Worker URL</label>
				<input
					id="api-url"
					name="apiUrl"
					type="url"
					placeholder="https://your-worker.workers.dev"
					required
					spellcheck="false"
				>

				<label for="api-token">API token</label>
				<input
					id="api-token"
					name="apiToken"
					type="password"
					required
					autocomplete="off"
					spellcheck="false"
				>

				<button id="test-button" type="submit">
					Test connection
				</button>
				<p id="result" role="status" aria-live="polite"></p>
			</form>
		</main>
		<script src="settings.js"></script>
	</body>
</html>
